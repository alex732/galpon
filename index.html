<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <title>ZENTINEL LITE</title>
    <style>
        body { background: #0b1120; color: #f8fafc; font-family: sans-serif; margin: 0; overflow-y: auto; }
        .header { background: #020617; border-bottom: 2px solid #1e293b; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .brand { font-size: 18px; font-weight: 900; color: #38bdf8; letter-spacing: 1px; }
        .layout { display: grid; grid-template-columns: 180px 1fr 300px; gap: 10px; padding: 10px; }
        .col { display: flex; flex-direction: column; gap: 10px; }
        .card { background: #111827; border: 1px solid #1e293b; border-radius: 4px; padding: 10px; }
        .card-h { font-size: 10px; color: #38bdf8; font-weight: 800; border-bottom: 1px solid #1e293b; margin-bottom: 10px; text-transform: uppercase; }
        .gauge-box { background: #020617; border-radius: 50%; width: 85px; height: 85px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 10px; border: 3px solid #22c55e; }
        .v-val { font-size: 18px; font-weight: bold; }
        .v-lbl { font-size: 8px; color: #94a3b8; }
        .live-snap { width: 100%; height: 320px; background: #000; border-radius: 4px; object-fit: cover; border: 2px solid #334155; }
        .matrix { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin-top: 10px; background: #000; border: 1px solid #38bdf8; }
        .cell { height: 50px; background: #000; border: 0.5px solid #020617; position: relative; cursor: pointer; }
        .cell img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }
        .cell.active { border: 2px solid #10b981; }
        .cell-tag { position: absolute; bottom: 0; width: 100%; font-size: 7px; background: rgba(0,0,0,0.7); text-align: center; color: #38bdf8; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; }
        .modal img { max-width: 90%; max-height: 80%; border: 2px solid #38bdf8; }
        .close-btn { position: absolute; top: 20px; right: 20px; padding: 10px; background: #ef4444; cursor: pointer; }
        .sys-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .sys-item { background: #020617; padding: 5px; text-align: center; font-size: 9px; border: 1px solid #1e293b; }
        .sys-val { display: block; color: #38bdf8; font-weight: bold; }
        #chat, #sensor-log, #ia-log { font-family: monospace; font-size: 9px; overflow-y: auto; height: 120px; background: #020617; border: 1px solid #38bdf8; padding: 5px; }
        .wifi-container { display: flex; align-items: flex-end; gap: 2px; height: 12px; justify-content: center; }
        .w-bar { width: 3px; background: #334155; }
        .w-bar.on { background: #10b981; }
        .pulse-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #334155; }
        .beat { animation: heartbeat 0.5s ease-out; }
        @keyframes heartbeat { 0% { transform: scale(1); background: #10b981; } 100% { transform: scale(1); background: #334155; } }
    </style>
</head>
<body>
    <div id='modal' class='modal' onclick="this.style.display='none'"><div class='close-btn'>CERRAR</div><img id='modal-img'></div>
    <div class='header'><div class='brand'>ZENTINEL REMOTE LITE</div><div id='topDate'>--/--/-- --:--:--</div></div>
    <div class='layout'>
        <div class='col'>
            <div class='card'><div class='card-h'>Sensores</div><div class='gauge-box'><span id='vT' class='v-val'>--</span><span class='v-lbl'>TEMP</span></div><div class='gauge-box'><span id='vH' class='v-val'>--</span><span class='v-lbl'>HUM</span></div><div class='gauge-box'><span id='vN' class='v-val'>--</span><span class='v-lbl'>NH3</span></div></div>
            <div class='card'><div class='card-h'>Biometría IA</div><div class='sys-grid'><div class='sys-item'><span id='b-aves' class='sys-val'>--</span>AVES</div><div class='sys-item'><span id='b-peso' class='sys-val'>--</span>PESO</div><div class='sys-item'><span id='b-temp' class='sys-val'>--</span>TEMP</div></div></div>
        </div>
        <div class='col'>
            <div id='banner' style='background:#064e3b;padding:10px;text-align:center;'></div>
            <img id='live-snap' class='live-snap'>
            <div id='matrix' class='matrix'></div>
            <div class='card'><div class='card-h'>Terminal Remoto</div><div id='chat'></div></div>
        </div>
        <div class='col'>
            <div class='card'><div class='card-h'>Sistema</div><div class='sys-grid'><div class='sys-item'><span id='cpu' class='sys-val'>--</span>CPU</div><div class='sys-item'><span id='ram' class='sys-val'>--</span>RAM</div><div class='sys-item'><span id='cam-pulse' class='pulse-dot'></span>CAM</div></div></div>
            <div class='card'><div class='card-h'>Alertas IA</div><div id='ia-log'></div></div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        const db = getDatabase(initializeApp({databaseURL: "https://ff8e0e803d5fb7abbaef8f3af695130a7c1ae3ed-default-rtdb.firebaseio.com/"}));
        
        const matrix = document.getElementById('matrix');
        for(let i=0; i<16; i++) matrix.innerHTML += `<div class='cell' id='d_F${Math.floor(i/4)}_C${i%4}'><img id='img_F${Math.floor(i/4)}_C${i%4}'></div>`;
        
        onValue(ref(db, '/'), (snapshot) => {
            const d = snapshot.val();
            if(!d) return;
            document.getElementById('vT').innerText = (d.t || '--') + '°';
            document.getElementById('vH').innerText = (d.h || '--') + '%';
            document.getElementById('vN').innerText = (d.n || '--');
            document.getElementById('b-aves').innerText = d.bio_a || '--';
            document.getElementById('live-snap').src = d.cam_snapshot_url || '';
            if(d.cells) Object.keys(d.cells).forEach(k => document.getElementById('img_'+k).src = d.cells[k]);
        });
        window.openModal = (id) => {
            document.getElementById('modal-img').src = document.getElementById('img_'+id).src;
            document.getElementById('modal').style.display = 'flex';
        };
    </script>
</body>
</html>
